<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DevOps Demo</title>
  <style>
    body{margin:0;background:#101827;color:#e8eef8;font:18px system-ui;display:grid;min-height:100vh;place-items:center}
    main{width:min(720px,85%);padding:36px;border:1px solid #34445e;border-radius:20px;background:#172338}
    h1{font-size:42px;margin:12px 0}p{line-height:1.6}.badge{color:#7ff0cf;font-weight:700}
    code{background:#253750;padding:6px 10px;border-radius:6px}small{color:#a7b9d0}
  </style>
</head>
<body><main>
  <div class="badge">KUBERNETES · HELM · APPLICATION RELEASES</div>
  <h1>DevOps Demo</h1>
  <p>{{ message }}</p>
  <p>Application version: <code>{{ version }}</code></p>
  <p>Container / Pod hostname: <code>{{ hostname }}</code></p>
  <small>Assignment 7: Application deployment and Helm release management</small>
</main></body></html>
